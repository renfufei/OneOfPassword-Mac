name: OneOfPassword
options:
  bundleIdPrefix: com.oneofpassword
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  ENABLE_HARDENED_RUNTIME: YES

targets:
  OneOfPassword:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: OneOfPassword
        excludes:
          - "**/*.md"
    resources:
      - path: OneOfPassword/Resources
        optional: true
      - path: OneOfPassword/Assets.xcassets
    info:
      path: OneOfPassword/Info.plist
      properties:
        CFBundleName: OneOfPassword
        CFBundleDisplayName: OneOfPassword
        CFBundleIdentifier: com.oneofpassword.app
        CFBundleVersion: "79"
        CFBundleShortVersionString: "1.79"
        # 开发区域 + 声明中文：决定系统级对话框（NSSavePanel / NSOpenPanel）的界面语言。
        # 只声明 en 时，系统保存面板会给中文用户弹英文的「Save As / Tags / Where / Cancel」。
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh-Hans
          - en
        LSMinimumSystemVersion: "13.0"
        NSCameraUsageDescription: 需要摄像头权限来扫描 GA 二维码
        NSMicrophoneUsageDescription: 录屏时录制讲解旁白需要麦克风权限
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.oneofpassword.backup
            UTTypeDescription: OneOfPassword Backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - 1pwd
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.oneofpassword.app
      SWIFT_VERSION: "5.9"
      INFOPLIST_FILE: OneOfPassword/Info.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: OneOfPassword/OneOfPassword.entitlements
      properties:
        com.apple.security.app-sandbox: false
